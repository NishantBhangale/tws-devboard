services:
  postgresql:
    image: postgres:16
    container_name: ${POSTGRES_HOST}
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - ${POSTGRES_DB}_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devboard-net
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - devboard-net
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    depends_on:
      - backend
    networks:
      - devboard-net
volumes:
  devboard_data:
    name: ${POSTGRES_DB}_data
networks:
  devboard-net:
    name: devboard-net
    driver: bridge

