name: secret-scanning
on:
  workflow_call:
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: code-checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 ### fetch all the commits form 0th level
      - name: secret-scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
