# Goal: I have to Lint, Build, Test the code for Frontend & Backend
# then Push the images to Dockerhub

name: CI

on:
    push:
        branches: [ "main" ]

jobs:
    frontend:
        runs-on: ubuntu-latest
        needs: [backend]
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: setup node
              uses: actions/setup-node@v7
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: './frontend/package-lock.json'

            - name: Install Dependencies
              run: npm ci --legacy-peer-deps
              working-directory: ./frontend

            - name: Lint
              run: npm run lint
              working-directory: ./frontend

            - name: run tests
              run: npm run test
              working-directory: ./frontend
            
            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                file: ./frontend/Dockerfile
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard_frontend:latest
    
    backend:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: setup go
              uses: actions/setup-go@v7
              with:
                #go-version: '1.23' When both inputs are provided, actions/setup-go prioritizes go-version and ignores go-version-file entirely.
                cache: 'go'
                cache-dependency-path: ./backend/go.sum
                go-version-file: 'go.mod'
            - name: check formatter
              run: go fmt
              working-directory: ./backend
                
            - name: check linting
              run: go vet
              working-directory: ./backend

            - name: Run tests
              run: go test
              working-directory: ./backend
            
            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                file: ./backend/Dockerfile
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard_backend:latest
            