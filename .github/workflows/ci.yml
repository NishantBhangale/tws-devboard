# Goal: Build the image for Devboard frontend and push to dockerhub, only after successful linting of code 

name: devboard_CI

on: 
 push:
    branches:
      - main
jobs:
    code-lint:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: './frontend/package-lock.json'       

        - name: Install Dependencies
          run: npm ci
          working-directory: frontend     

        - name: Run ESLint
          run: npm run lint
          working-directory: frontend


    build-and-push:
        needs: [code-lint]
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v7
        
        - name: Log in to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            context: ./frontend
            file: ./frontend/Dockerfile
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard_frontend:latest
        
