name: devboard_CI

jobs:
    Build and Push:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v7
        
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        