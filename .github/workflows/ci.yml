# Goal: Build the image for Devboard frontend and push to dockerhub, only after successful linting of code 

name: devboard_CI

on: 
 push:
    branches:
      - main
jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: 'npm'
            cache-dependency-path: './frontend/package-lock.json'       

        - name: Install Dependencies
          run: npm ci --legacy-peer-deps
          working-directory: frontend     

        - name: Run ESLint
          run: npm run lint
          working-directory: frontend

        - name: Run tests
          run: npm run test
          working-directory: frontend
      
        - name: Log in to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            context: ./frontend
            file: ./frontend/Dockerfile
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard_frontend:latest

    backend:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Go
          uses: actions/setup-go@v7
          with:
            # Version or version range of Go to use
            go-version: '1.23'
            go-version-file: 'go.mod'
            cache-dependency-path: 'go.sum'
        
        - name: check formatter
          run: go fmt
          working-directory: backend
        
        - name: check linting
          run: go vet
          working-directory: backend

        - name: Run tests
          run: go test
          working-directory: backend
        
        - name: Log in to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            context: ./backend
            file: ./backend/Dockerfile
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard_backend:latest
                    
