name: devboard_CI

on: 
 push:
    branches:
      - main
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v7
        
        - name: Log in to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        
