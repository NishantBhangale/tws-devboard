name: CD-devboard
on:
  workflow_run:
    workflows:
      - CI-devboard
    types:
      - completed
    branches: 
      - Main
  #workflow-dispatch:
jobs:
  deploy:
    runs-on: ip-172-31-3-243
    steps:
    - name: Checkout code.
      uses: actions/checkout@v7
    - name: Copy env files
      run: cp .env.example .env && cp backend/.env.sample .env
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Pull images
      run: |
        docker compose pull
        docker compose up -d
      