name: CD-devboard
on:
  workflow_run:
    workflows:
      - CI-devboard
    types:
      - completed
    branches: 
      - main
  #workflow-dispatch:
jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - name: Checkout code.
      uses: actions/checkout@v7
    - name: Copy env files
      run: |
        cp .env.example .env
        cp backend/.env.sample backend/.env
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Pull images
      run: |
        docker compose pull
        docker compose up -d
      